<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Crucial for Android mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>My Android PWA</title>
    
    <!-- Link to the Android Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📱 Hello, Android!</h1>
        <p>This is a single-file PWA.</p>
        <p id="status">Checking connection...</p>
    </div>

    <script>
        // Check if the browser supports Service Workers
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg.scope))
                    .catch(err => console.error('Service Worker Failed:', err));
            });
        }

        // Simple online/offline indicator
        const statusEl = document.getElementById('status');
        const updateStatus = () => {
            statusEl.textContent = navigator.onLine ? "🟢 You are online" : "🔴 You are offline";
        };
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    </script>
</body>
</html>
